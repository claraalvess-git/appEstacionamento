<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================
           SPOTLIGHT
        ========================================= */

        .spotlight {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 700px;
            height: 700px;

            background: radial-gradient(
                circle,
                rgba(0, 210, 133, 0.12) 0%,
                rgba(0, 210, 133, 0) 70%
            );

            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;

            will-change: left, top;
        }

        body::before {
            content: '';

            position: fixed;
            top: -10%;
            left: -10%;

            width: 400px;
            height: 400px;

            background: rgba(0, 210, 133, 0.08);
            filter: blur(120px);
            border-radius: 50%;

            pointer-events: none;
            z-index: 0;
        }

        /* =========================================
           ESTRUTURA
        ========================================= */

        .stage {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
            padding: 50px 24px;
        }

        /* =========================================
           CABEÇALHO
        ========================================= */

        .mark {
            margin-bottom: 30px;
        }

        .mark .kicker {
            display: block;

            margin-bottom: 6px;

            color: #8b949e;

            font-size: 0.85rem;
            font-weight: 500;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .mark h1 {
            color: #ffffff;

            font-size: 2.2rem;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .mark .rule {
            width: 42px;
            height: 3px;

            margin-top: 10px;

            background-color: #00d285;

            border-radius: 2px;
        }

        /* =========================================
           CARD PRINCIPAL
        ========================================= */

        .card {
            position: relative;

            width: 100%;

            padding: 32px;

            background: rgba(22, 27, 34, 0.85);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);

            overflow: hidden;
        }

        .card::before {
            content: '';

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                #00d285 0%,
                #008faa 100%
            );
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }

        .card-title h2 {
            color: #f0f6fc;

            font-size: 1.4rem;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .card-title p {
            color: #8b949e;

            font-size: 0.88rem;
            line-height: 1.4;
        }

        /* =========================================
           AÇÕES
        ========================================= */

        .actions {
            display: flex;
            gap: 10px;

            flex-wrap: wrap;
        }

        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 0 16px;

            border-radius: 8px;

            font-size: 0.88rem;
            font-weight: 600;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.1s ease,
                box-shadow 0.2s ease;
        }

        .action-primary {
            background-color: #00d285;
            color: #0d1117;

            border: 1px solid #00d285;
        }

        .action-primary:hover {
            background-color: #00e692;

            box-shadow: 0 8px 20px rgba(0, 210, 133, 0.15);
        }

        .action-secondary {
            background: rgba(13, 17, 23, 0.6);

            color: #f0f6fc;

            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .action-secondary:hover {
            background: rgba(255, 255, 255, 0.06);

            border-color: rgba(0, 210, 133, 0.4);
        }

        .action:active {
            transform: scale(0.98);
        }

        /* =========================================
           TABELA
        ========================================= */

        .table-container {
            width: 100%;

            overflow-x: auto;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;

            background: rgba(13, 17, 23, 0.45);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 650px;
        }

        thead {
            background: rgba(255, 255, 255, 0.035);
        }

        th {
            padding: 15px 18px;

            color: #8b949e;

            font-size: 0.75rem;
            font-weight: 600;

            text-align: left;

            text-transform: uppercase;
            letter-spacing: 0.8px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        td {
            padding: 16px 18px;

            color: #f0f6fc;

            font-size: 0.9rem;

            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        tbody tr {
            transition:
                background-color 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(0, 210, 133, 0.035);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================================
           STATUS
        ========================================= */

        td:last-child {
            color: #00d285;
            font-weight: 600;
        }

        td:last-child::before {
            content: '';

            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 8px;

            background: #00d285;

            border-radius: 50%;

            box-shadow: 0 0 8px rgba(0, 210, 133, 0.5);
        }

        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 760px) {

            .stage {
                padding: 32px 16px;
            }

            .mark h1 {
                font-size: 1.9rem;
            }

            .card {
                padding: 24px;
            }

            .card-header {
                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .action {
                flex: 1;
            }
        }

        @media (max-width: 480px) {

            .stage {
                padding: 24px 12px;
            }

            .card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .action {
                width: 100%;
            }

            .table-container {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

<!-- Iluminação que acompanha o mouse -->
<div class="spotlight" id="spotlight"></div>

<main class="stage">

    <div class="mark">
        <span class="kicker">Controle de acesso</span>

        <h1>Estacionamento</h1>

        <div class="rule"></div>
    </div>

    <section class="card">

        <div class="card-header">

            <div class="card-title">
                <h2>Painel</h2>

                <p>
                    Controle de entrada e saída dos veículos.
                </p>
            </div>

            <div class="actions">

                <a
                        href="/veiculo/registrar-entrada"
                        class="action action-primary"
                >
                    Registrar Entrada
                </a>

                <a
                        href="veiculo/registrar-saida"
                        class="action action-secondary"
                >
                    Registrar Saída
                </a>

            </div>

        </div>

        <div class="table-container">

            <table>
                <thead>
                <tr>
                    <th>Placa</th>
                    <th>Modelo</th>
                    <th>Hora Entrada</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="veiculo : ${veiculos}">
                    <td th:text="${veiculo.placa}"></td>
                    <td th:text="${veiculo.modelo}"></td>
                    <td th:text="${veiculo.horaEntrada}"></td>
                    <td>Estacionado</td>
                </tr>
                </tbody>
            </table>

        </div>

    </section>

</main>

<script>
    const spotlight = document.getElementById('spotlight');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let currentX = mouseX;
    let currentY = mouseY;

    document.addEventListener('mousemove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
    });

    function animateSpotlight() {
        currentX += (mouseX - currentX) * 0.08;
        currentY += (mouseY - currentY) * 0.08;

        spotlight.style.left = `${currentX}px`;
        spotlight.style.top = `${currentY}px`;

        requestAnimationFrame(animateSpotlight);
    }

    animateSpotlight();
</script>

</body>
</html>
