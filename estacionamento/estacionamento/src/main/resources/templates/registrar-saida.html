<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar saída</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            position: relative;
        }

        /* =========================================
           SPOTLIGHT
        ========================================= */

        .spotlight {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 700px;
            height: 700px;

            background: radial-gradient(
                circle,
                rgba(0, 210, 133, 0.12) 0%,
                rgba(0, 210, 133, 0) 70%
            );

            border-radius: 50%;

            transform: translate(-50%, -50%);

            pointer-events: none;
            z-index: 0;

            will-change: left, top;
        }

        body::before {
            content: '';

            position: absolute;

            top: -10%;
            left: -10%;

            width: 400px;
            height: 400px;

            background: rgba(0, 210, 133, 0.08);

            filter: blur(120px);

            border-radius: 50%;

            pointer-events: none;
        }

        /* =========================================
           ESTRUTURA
        ========================================= */

        .stage {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 440px;

            padding: 20px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* =========================================
           BOTÃO VOLTAR
        ========================================= */

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 20px;
            padding: 8px 14px;

            background: rgba(22, 27, 34, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;

            color: #8b949e;

            font-size: 0.85rem;
            font-weight: 500;

            text-decoration: none;

            transition:
                color 0.2s ease,
                border-color 0.2s ease,
                background-color 0.2s ease,
                transform 0.1s ease;
        }

        .btn-voltar:hover {
            color: #00d285;
            border-color: #00d285;
            background: rgba(0, 210, 133, 0.06);
        }

        .btn-voltar:active {
            transform: scale(0.98);
        }

        .btn-voltar svg {
            width: 16px;
            height: 16px;
        }

        /* =========================================
           MARCA
        ========================================= */

        .mark {
            margin-bottom: 28px;
        }

        .mark .kicker {
            display: block;

            margin-bottom: 6px;

            color: #8b949e;

            font-size: 0.85rem;
            font-weight: 500;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .mark h1 {
            color: #ffffff;

            font-size: 2.2rem;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .mark .rule {
            width: 42px;
            height: 3px;

            margin-top: 10px;

            background-color: #00d285;

            border-radius: 2px;
        }

        /* =========================================
           CARD
        ========================================= */

        .card {
            position: relative;

            width: 100%;

            padding: 36px 32px;

            background: rgba(22, 27, 34, 0.85);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);

            overflow: hidden;
        }

        .card .clip {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                #00d285 0%,
                #008faa 100%
            );
        }

        .card h2 {
            color: #f0f6fc;

            font-size: 1.4rem;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .card .sub {
            color: #8b949e;

            font-size: 0.88rem;
            line-height: 1.4;

            margin-bottom: 28px;
        }

        /* =========================================
           CAMPO DE SELEÇÃO
        ========================================= */

        .field {
            position: relative;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #8b949e;

            font-size: 0.82rem;
            font-weight: 500;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '⌄';

            position: absolute;

            top: 50%;
            right: 14px;

            transform: translateY(-55%);

            color: #8b949e;

            font-size: 1.1rem;

            pointer-events: none;
        }

        select {
            width: 100%;
            height: 54px;

            padding: 0 42px 0 14px;

            appearance: none;
            -webkit-appearance: none;

            background: rgba(13, 17, 23, 0.6);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 8px;

            color: #ffffff;

            font-size: 0.95rem;

            outline: none;

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        select:focus {
            background: rgba(13, 17, 23, 0.9);

            border-color: #00d285;

            box-shadow: 0 0 0 3px rgba(0, 210, 133, 0.08);
        }

        select:hover {
            border-color: rgba(0, 210, 133, 0.45);
        }

        select option {
            background: #161b22;
            color: #ffffff;
        }

        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 480px) {

            .stage {
                padding: 16px;
            }

            .mark h1 {
                font-size: 1.9rem;
            }

            .card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

<!-- Iluminação que acompanha o mouse -->
<div class="spotlight" id="spotlight"></div>

<div class="stage">

    <div class="content">

        <a href="/painel" th:href="@{/painel}" class="btn-voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
            Voltar ao painel
        </a>

        <div class="mark">
            <span class="kicker">Controle de acesso</span>

            <h1>Estacionamento</h1>

            <div class="rule"></div>
        </div>

        <div class="card">

            <div class="clip"></div>

            <h2>Registrar saída</h2>

            <p class="sub">
                Selecione a placa do veículo que deseja retirar.
            </p>

            <div class="field">

                <label for="placa">
                    Selecionar placa
                </label>

                <div class="select-wrapper">

                    <select
                            id="placa"
                            onchange="selecionarVeiculo(this.value)"
                    >

                        <option value="">
                            Selecione a placa
                        </option>

                        <option
                                th:each="v : ${veiculos}"
                                th:value="${v.id}"
                                th:text="${v.placa}"
                                th:selected="${veiculo != null && veiculo.id == v.id}">
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    const spotlight = document.getElementById('spotlight');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let currentX = mouseX;
    let currentY = mouseY;

    document.addEventListener('mousemove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
    });

    function animateSpotlight() {
        currentX += (mouseX - currentX) * 0.08;
        currentY += (mouseY - currentY) * 0.08;

        spotlight.style.left = `${currentX}px`;
        spotlight.style.top = `${currentY}px`;

        requestAnimationFrame(animateSpotlight);
    }

    animateSpotlight();


    /* =========================================
       LÓGICA ORIGINAL
    ========================================= */

    function selecionarVeiculo(id) {
        if (id) {
            window.location.href = "/veiculo/saida/" + id;
        } else {
            window.location.href = "/veiculo/saida";
        }
    }
</script>

</body>
</html>
